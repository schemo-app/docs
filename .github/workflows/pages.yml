name: Deploy documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Install Hugo
        env:
          HUGO_VERSION: '0.170.0'
          HUGO_SHA256: 0930754ec22ad2dd1a252f8c31a5e57faccc9d15f1c3d381ddafcb96eeb8aef0
        run: |
          asset="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          archive="$RUNNER_TEMP/$asset"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/$asset"
          printf '%s  %s\n' "$HUGO_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" hugo
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages
      - name: Build documentation
        env:
          PAGES_HOST: ${{ steps.pages.outputs.host }}
          PAGES_PATH: ${{ steps.pages.outputs.base_path }}
        run: hugo --minify --panicOnWarning --baseURL "https://${PAGES_HOST}${PAGES_PATH}/"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
