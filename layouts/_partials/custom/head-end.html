{{- $inter := "fonts/inter-variable.woff2" | relURL -}}
<link rel="preload" href="{{ $inter }}" as="font" type="font/woff2" crossorigin>
<style>
  @font-face {
    font-family: Inter;
    src: url("{{ $inter }}") format("woff2");
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
  }
</style>
