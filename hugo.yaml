baseURL: https://docs.schemo.app/
title: Schemo Docs
defaultContentLanguage: en
enableRobotsTXT: true

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  highlight:
    noClasses: false

languages:
  en:
    label: English
    locale: en
    weight: 1

menu:
  main:
    - name: Documentation
      pageRef: /docs
      weight: 1
      params:
        icon: book-open
    - name: Guides
      pageRef: /guides
      weight: 2
      params:
        icon: check-circle
    - name: Support
      pageRef: /support
      weight: 3
      params:
        icon: question-mark-circle

params:
  description: Learn to send requests, inspect responses, and test APIs in the Schemo desktop app.
  repositoryURL: https://github.com/schemo-app/schemo
  downloadURL: https://github.com/schemo-app/schemo/releases/latest
  theme:
    default: system
