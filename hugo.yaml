baseURL: https://docs.schemo.app/
title: Schemo Docs
defaultContentLanguage: en
enableRobotsTXT: true

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  highlight:
    noClasses: false

languages:
  en:
    label: English
    locale: en
    weight: 1

menu:
  main:
    - name: Documentation
      pageRef: /docs
      weight: 1
    - name: Guides
      pageRef: /guides
      weight: 2
    - name: Support
      pageRef: /support
      weight: 3
    - name: Download
      url: https://github.com/schemo-app/schemo/releases/latest
      weight: 4
    - name: Search
      weight: 5
      params:
        type: search
    - name: GitHub
      url: https://github.com/schemo-app/schemo
      weight: 7
      params:
        icon: github
    - name: Theme
      weight: 6
      params:
        type: theme-toggle

params:
  description: Learn to send requests, inspect responses, and test APIs in the Schemo desktop app.
  navbar:
    logo:
      path: images/schemo.svg
      width: 30
      height: 30
  theme:
    default: system
    displayToggle: true
  footer:
    displayCopyright: false
    displayPoweredBy: false
  editURL:
    enable: false
